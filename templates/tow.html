<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Wall · Houston Truck Wreck Monitor by K-Todd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0B0E13;
    --panel:#141922;
    --panel-2:#1B2230;
    --rule:#2A3342;
    --ink:#EDF1F7;
    --muted:#8996AB;
    --amber:#F0A431;
    --red:#FF5A52;
    --orange:#FF9142;
    --blue:#4FA8FF;
    --green:#3FD08A;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Barlow Condensed','Barlow',sans-serif;text-transform:uppercase;letter-spacing:.035em;margin:0;}
  a{color:inherit;}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    padding:14px 22px;
    background:linear-gradient(180deg,#121822 0%,#0D1219 100%);
    border-bottom:1px solid var(--rule);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .brand .skyline{width:44px;height:30px;flex:none;display:block;}
  .brand h1{font-size:25px;line-height:1;font-weight:700;white-space:nowrap;}
  .brand h1 small{
    font-size:15px;font-weight:600;color:var(--amber);
    letter-spacing:.06em;margin-left:8px;
  }
  .brand .tag{
    font-size:11px;letter-spacing:.16em;color:var(--muted);
    text-transform:uppercase;margin-top:3px;font-family:'Barlow',sans-serif;font-weight:600;
  }
  .masthead .spacer{flex:1 1 auto;}
  .clock{
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:27px;font-weight:500;letter-spacing:.02em;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .clock small{display:block;font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:5px;font-family:'Barlow',sans-serif;font-weight:600;}
  .pulse{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 13px;border-radius:999px;
    background:rgba(63,208,138,.1);border:1px solid rgba(63,208,138,.32);
    font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--green);
    white-space:nowrap;
  }
  .pulse.stale{background:rgba(255,145,66,.1);border-color:rgba(255,145,66,.34);color:var(--orange);}
  .pulse.dead{background:rgba(255,90,82,.1);border-color:rgba(255,90,82,.36);color:var(--red);}
  .pulse .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blip 2s ease-in-out infinite;}
  @keyframes blip{0%,100%{opacity:1;}50%{opacity:.25;}}
  .signout{
    font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);text-decoration:none;padding:8px 11px;border-radius:7px;
    border:1px solid transparent;white-space:nowrap;
  }
  .signout:hover{color:var(--ink);background:var(--panel-2);border-color:var(--rule);}

  /* ---------- kpi row ---------- */
  .kpis{
    display:grid;gap:12px;padding:16px 22px 4px;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  }
  .kpi{
    background:var(--panel);border:1px solid var(--rule);border-left-width:4px;
    border-radius:11px;padding:14px 16px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .kpi .label{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);}
  .kpi .value{font-family:'Barlow Condensed',sans-serif;font-size:46px;font-weight:700;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums;}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .kpi.hazmat{border-left-color:var(--red);}   .kpi.hazmat .value{color:var(--red);}
  .kpi.wreck{border-left-color:var(--orange);} .kpi.wreck .value{color:var(--orange);}
  .kpi.stall{border-left-color:var(--amber);}  .kpi.stall .value{color:var(--amber);}
  .kpi.system{border-left-color:var(--green);} .kpi.system .value{color:var(--green);font-size:30px;padding-top:9px;}
  .kpi.system.down{border-left-color:var(--red);} .kpi.system.down .value{color:var(--red);}

  /* ---------- layout ---------- */
  .wrap{
    display:grid;gap:14px;padding:14px 22px 22px;
    grid-template-columns:minmax(0,1.65fr) minmax(320px,.95fr);
    align-items:stretch;min-height:calc(100vh - 232px);
  }
  @media (max-width:1080px){.wrap{grid-template-columns:1fr;min-height:0;}}
  .panel{
    background:var(--panel);border:1px solid var(--rule);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:0;
  }
  .panel > header{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none;
    padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--panel-2);
  }
  .panel > header h2{font-size:15px;font-weight:700;}
  .panel > header .count{
    font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;
    font-family:'JetBrains Mono',monospace;margin-left:auto;
  }
  .filters{display:flex;gap:5px;flex-wrap:wrap;}
  .filters button{
    font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;color:var(--muted);border:1px solid var(--rule);
    padding:5px 10px;border-radius:999px;cursor:pointer;
  }
  .filters button:hover{color:var(--ink);}
  .filters button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);}

  /* ---------- incident feed ---------- */
  .feed{flex:1 1 auto;min-height:300px;overflow-y:auto;}
  .feed::-webkit-scrollbar,.log::-webkit-scrollbar{width:9px;}
  .feed::-webkit-scrollbar-thumb,.log::-webkit-scrollbar-thumb{background:var(--rule);border-radius:5px;}
  .inc{
    display:grid;grid-template-columns:5px 1fr auto;gap:0 14px;
    border-bottom:1px solid var(--rule);padding:0;align-items:stretch;
  }
  .inc:last-child{border-bottom:0;}
  .inc .stripe{background:var(--rule);}
  .inc.hazmat .stripe{background:var(--red);}
  .inc.wreck  .stripe{background:var(--orange);}
  .inc.stall  .stripe{background:var(--amber);}
  .inc .body{padding:12px 0;min-width:0;}
  .inc .loc{font-weight:600;font-size:16px;line-height:1.25;}
  .inc .desc{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.4;}
  .inc .meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:7px;}
  .chip{
    font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
    padding:3px 8px;border-radius:5px;border:1px solid;
  }
  .chip.hazmat{color:var(--red);border-color:rgba(255,90,82,.42);background:rgba(255,90,82,.1);}
  .chip.wreck{color:var(--orange);border-color:rgba(255,145,66,.42);background:rgba(255,145,66,.1);}
  .chip.stall{color:var(--amber);border-color:rgba(240,164,49,.42);background:rgba(240,164,49,.1);}
  .chip.other{color:var(--muted);border-color:var(--rule);background:var(--panel-2);}
  .chip.sev{color:var(--muted);border-color:var(--rule);background:transparent;font-family:'JetBrains Mono',monospace;letter-spacing:.06em;}
  .chip.fresh{color:var(--ground);background:var(--green);border-color:var(--green);}
  .inc .when{
    padding:12px 16px 12px 0;text-align:right;white-space:nowrap;
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);line-height:1.55;
  }
  .inc .when .t{color:var(--ink);font-size:14px;font-weight:500;display:block;}
  .inc .when a{
    display:inline-block;margin-top:6px;font-family:'Barlow',sans-serif;font-size:10.5px;
    font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);text-decoration:none;
  }
  .inc .when a:hover{text-decoration:underline;}
  .inc.new{animation:landed 2.4s ease-out;}
  @keyframes landed{0%{background:rgba(63,208,138,.16);}100%{background:transparent;}}

  /* ---------- log ---------- */
  .log{flex:1 1 auto;min-height:150px;overflow-y:auto;padding:8px 0;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.65;}
  .log div{padding:2px 16px;display:flex;gap:10px;}
  .log .ts{color:#5C6878;flex:none;}
  .log .msg{color:#B6C2D2;min-width:0;overflow-wrap:anywhere;}
  .log .error .msg{color:var(--red);}
  .log .warning .msg{color:var(--orange);}

  .empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13.5px;}
  .err{
    margin:0 22px 12px;padding:10px 14px;border-radius:9px;
    background:rgba(255,90,82,.1);border:1px solid rgba(255,90,82,.34);
    color:var(--red);font-size:12.5px;font-weight:600;display:none;
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="brand">
    <!-- Houston skyline -->
    <svg class="skyline" viewBox="0 0 88 60" fill="none" aria-hidden="true">
      <g fill="#F0A431">
        <rect x="2"  y="38" width="9"  height="22"/>
        <rect x="13" y="30" width="7"  height="30"/>
        <rect x="22" y="20" width="8"  height="40"/>
        <path d="M32 14h9v46h-9z"/><path d="M36.5 6 41 14h-9z"/>
        <rect x="43" y="24" width="7"  height="36"/>
        <path d="M52 10h10v50H52z"/><path d="M57 2l5 8H52z"/>
        <rect x="64" y="27" width="8"  height="33"/>
        <rect x="74" y="35" width="6"  height="25"/>
        <rect x="82" y="43" width="5"  height="17"/>
      </g>
      <g fill="#0B0E13" opacity=".55">
        <rect x="4"  y="42" width="2" height="3"/><rect x="8" y="42" width="2" height="3"/>
        <rect x="34" y="20" width="2" height="3"/><rect x="38" y="20" width="2" height="3"/>
        <rect x="34" y="28" width="2" height="3"/><rect x="38" y="28" width="2" height="3"/>
        <rect x="54" y="16" width="2" height="3"/><rect x="58" y="16" width="2" height="3"/>
        <rect x="54" y="24" width="2" height="3"/><rect x="58" y="24" width="2" height="3"/>
        <rect x="66" y="32" width="2" height="3"/><rect x="70" y="32" width="2" height="3"/>
      </g>
    </svg>
    <div>
      <h1>Houston Truck Wreck Monitor <small>by K-Todd</small></h1>
      <div class="tag">Live Wall · Wrecks · Stalls · Hazmat Spills</div>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="pulse" id="pulse"><span class="dot"></span><span id="pulseText">Connecting</span></div>

  <div class="clock">
    <span id="clock">--:--:--</span>
    <small id="clockDate">Houston · Central</small>
  </div>

  <a class="signout" href="/tow/logout">Sign out</a>
</header>

<div class="err" id="err"></div>

<section class="kpis">
  <div class="kpi hazmat"><div class="label">Hazmat / Spills</div><div class="value" id="kHazmat">–</div><div class="sub">last 24 hours</div></div>
  <div class="kpi wreck"><div class="label">Wrecks</div><div class="value" id="kWreck">–</div><div class="sub">last 24 hours</div></div>
  <div class="kpi stall"><div class="label">Stalls</div><div class="value" id="kStall">–</div><div class="sub">last 24 hours</div></div>
  <div class="kpi system" id="kSystemCard"><div class="label">Feed</div><div class="value" id="kSystem">–</div><div class="sub" id="kSystemSub">next update –</div></div>
</section>

<main class="wrap">
  <section class="panel">
    <header>
      <h2>Incident Feed</h2>
      <div class="filters" id="filters">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="hazmat" aria-pressed="false">Hazmat</button>
        <button data-f="wreck" aria-pressed="false">Wrecks</button>
        <button data-f="stall" aria-pressed="false">Stalls</button>
      </div>
      <span class="count" id="feedCount"></span>
    </header>
    <div class="feed" id="feed"><div class="empty">Loading incidents…</div></div>
  </section>

  <section class="panel">
    <header><h2>Live Scrape Log</h2><span class="count" id="logCount"></span></header>
    <div class="log" id="log"><div><span class="msg">Loading…</span></div></div>
  </section>
</main>

<script>
(function(){
  "use strict";

  var REFRESH_MS = 20000;      // poll the API every 20s
  var STALE_MS   = 70000;      // no successful poll in 70s -> amber
  var DEAD_MS    = 180000;     // no successful poll in 3m  -> red

  var filter = "all";
  var lastGood = 0;
  var seen = null;             // Set of incident ids from the previous render
  var latest = { incidents: [], counts: {} };

  var $ = function(id){ return document.getElementById(id); };

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function ago(mins){
    if (mins === null || mins === undefined) return "";
    if (mins < 1)  return "just now";
    if (mins < 60) return mins + "m ago";
    var h = Math.floor(mins / 60);
    if (h < 24) return h + "h ago";
    return Math.floor(h / 24) + "d ago";
  }

  /* ---------- clock ---------- */
  function tickClock(){
    var now = new Date();
    var opts = { timeZone:"America/Chicago", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true };
    $("clock").textContent = now.toLocaleTimeString("en-US", opts);
    $("clockDate").textContent = now.toLocaleDateString("en-US", {
      timeZone:"America/Chicago", weekday:"short", month:"short", day:"numeric"
    }) + " · Central";
    paintPulse();
  }

  function paintPulse(){
    var el = $("pulse"), txt = $("pulseText");
    if (!lastGood){ el.className = "pulse"; txt.textContent = "Connecting"; return; }
    var age = Date.now() - lastGood;
    if (age > DEAD_MS){
      el.className = "pulse dead";
      txt.textContent = "Offline " + Math.round(age/60000) + "m";
    } else if (age > STALE_MS){
      el.className = "pulse stale";
      txt.textContent = "Stale " + Math.round(age/1000) + "s";
    } else {
      el.className = "pulse";
      txt.textContent = "Live · " + Math.round(age/1000) + "s";
    }
  }

  /* ---------- rendering ---------- */
  function renderKpis(d){
    var c = d.counts || {}, sc = d.scraper || {};
    $("kHazmat").textContent = c.hazmat || 0;
    $("kWreck").textContent  = c.wreck  || 0;
    $("kStall").textContent  = c.stall  || 0;

    var card = $("kSystemCard");
    $("kSystem").textContent = sc.running ? "Active" : "Stopped";
    card.className = "kpi system" + (sc.running ? "" : " down");
    $("kSystemSub").textContent = sc.running
      ? ("next update " + (sc.next_run_label || "–") + " · every " + (sc.interval_seconds || "?") + "s")
      : "feed is not running";

    document.title = (c.hazmat || 0) + "H " + (c.wreck || 0) + "W " + (c.stall || 0) + "S · Live Wall by K-Todd";
  }

  function renderFeed(){
    var list = latest.incidents || [];
    if (filter !== "all") list = list.filter(function(i){ return i.category === filter; });

    $("feedCount").textContent = list.length + " shown · " + (latest.incidents || []).length + " total / 24h";

    if (!list.length){
      $("feed").innerHTML = '<div class="empty">No ' +
        (filter === "all" ? "incidents" : esc(filter) + " incidents") +
        ' in the last 24 hours.</div>';
      return;
    }

    var firstPaint = (seen === null);
    var next = new Set();
    var html = list.map(function(i){
      next.add(i.id);
      var isNew = !firstPaint && !seen.has(i.id);
      var cat = i.category || "other";
      return '<article class="inc ' + esc(cat) + (isNew ? " new" : "") + '">' +
        '<div class="stripe"></div>' +
        '<div class="body">' +
          '<div class="loc">' + esc(i.location) + '</div>' +
          '<div class="desc">' + esc(i.description) + '</div>' +
          '<div class="meta">' +
            '<span class="chip ' + esc(cat) + '">' + esc(cat) + '</span>' +
            '<span class="chip sev">SEV ' + esc(i.severity) + '</span>' +
            (isNew ? '<span class="chip fresh">New</span>' : "") +
          '</div>' +
        '</div>' +
        '<div class="when">' +
          '<span class="t">' + esc(i.incident_time || "") + '</span>' +
          esc(ago(i.age_minutes)) +
          (i.map_url ? '<br><a href="' + esc(i.map_url) + '" target="_blank" rel="noopener">Map ↗</a>' : "") +
          (i.transtar_url ? ' <a href="' + esc(i.transtar_url) + '" target="_blank" rel="noopener">TranStar ↗</a>' : "") +
        '</div>' +
      '</article>';
    }).join("");

    $("feed").innerHTML = html;
    seen = next;
  }

  function renderLog(logs){
    logs = logs || [];
    $("logCount").textContent = logs.length + " entries";
    if (!logs.length){ $("log").innerHTML = '<div><span class="msg">No log entries yet.</span></div>'; return; }
    $("log").innerHTML = logs.map(function(l){
      var ts = String(l.timestamp || "").split(" ");
      var short = ts.length > 1 ? ts.slice(1).join(" ").replace(" CST","") : (l.timestamp || "");
      return '<div class="' + esc(l.level || "info") + '">' +
        '<span class="ts">' + esc(short) + '</span>' +
        '<span class="msg">' + esc(l.message) + '</span></div>';
    }).join("");
  }

  /* ---------- polling ---------- */
  function poll(){
    fetch("/api/tow", { credentials:"same-origin", cache:"no-store" })
      .then(function(r){
        if (r.status === 401 || r.redirected){ throw new Error("Signed out — reload this page and log in again."); }
        if (!r.ok) throw new Error("Server returned " + r.status);
        return r.json();
      })
      .then(function(d){
        latest = d;
        lastGood = Date.now();
        $("err").style.display = "none";
        renderKpis(d);
        renderFeed();
        renderLog(d.logs);
        paintPulse();
      })
      .catch(function(e){
        var box = $("err");
        box.textContent = "⚠ " + e.message + " — retrying automatically.";
        box.style.display = "block";
        paintPulse();
      });
  }

  $("filters").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-f]");
    if (!btn) return;
    filter = btn.getAttribute("data-f");
    Array.prototype.forEach.call(this.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    renderFeed();
  });

  // Refresh immediately when the tab comes back to the foreground.
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) poll();
  });

  tickClock();
  setInterval(tickClock, 1000);
  poll();
  setInterval(poll, REFRESH_MS);
})();
</script>
</body>
</html>
