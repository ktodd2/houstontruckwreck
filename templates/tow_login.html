<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In · Houston Truck Wreck Monitor by K-Todd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0B0E13;
    --panel:#141922;
    --panel-2:#1B2230;
    --rule:#2A3342;
    --ink:#EDF1F7;
    --muted:#8996AB;
    --amber:#F0A431;
    --red:#FF5A52;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;
    background:var(--ground);color:var(--ink);
    font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;
    -webkit-font-smoothing:antialiased;padding:20px;
  }
  .card{
    width:100%;max-width:380px;
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    box-shadow:var(--shadow);padding:30px 28px 26px;
  }
  .brand{display:flex;align-items:center;gap:13px;margin-bottom:22px;}
  .brand svg{width:48px;height:33px;flex:none;}
  .brand h1{
    font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.035em;
    font-size:22px;line-height:1.15;margin:0;font-weight:700;
  }
  .brand h1 small{display:block;font-size:13px;color:var(--amber);letter-spacing:.08em;margin-top:3px;}
  label{
    display:block;font-size:10.5px;font-weight:700;letter-spacing:.15em;
    text-transform:uppercase;color:var(--muted);margin:14px 0 6px;
  }
  input{
    width:100%;font:inherit;color:var(--ink);
    background:var(--panel-2);border:1px solid var(--rule);border-radius:9px;
    padding:11px 13px;outline:none;
  }
  input:focus{border-color:var(--amber);}
  button{
    width:100%;margin-top:20px;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;
    text-transform:uppercase;letter-spacing:.08em;
    color:var(--ground);background:var(--amber);border:0;border-radius:9px;padding:12px;
  }
  button:hover{filter:brightness(1.08);}
  .error{
    margin-top:16px;padding:10px 13px;border-radius:9px;font-size:13px;font-weight:600;
    background:rgba(255,90,82,.1);border:1px solid rgba(255,90,82,.34);color:var(--red);
  }
  .foot{margin-top:18px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
</style>
</head>
<body>
  <form class="card" method="post" action="/tow/login" autocomplete="off">
    <div class="brand">
      <svg viewBox="0 0 88 60" fill="none" aria-hidden="true">
        <g fill="#F0A431">
          <rect x="2"  y="38" width="9"  height="22"/>
          <rect x="13" y="30" width="7"  height="30"/>
          <rect x="22" y="20" width="8"  height="40"/>
          <path d="M32 14h9v46h-9z"/><path d="M36.5 6 41 14h-9z"/>
          <rect x="43" y="24" width="7"  height="36"/>
          <path d="M52 10h10v50H52z"/><path d="M57 2l5 8H52z"/>
          <rect x="64" y="27" width="8"  height="33"/>
          <rect x="74" y="35" width="6"  height="25"/>
          <rect x="82" y="43" width="5"  height="17"/>
        </g>
      </svg>
      <h1>Houston Truck Wreck Monitor <small>by K-Todd</small></h1>
    </div>

    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus autocapitalize="none">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <button type="submit">Open the Live Wall</button>
    <div class="foot">Wrecks · Stalls · Hazmat Spills</div>
  </form>
</body>
</html>
